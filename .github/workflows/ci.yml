name: build-and-test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore StockFlow.slnx --configfile NuGet.Config
      - run: dotnet build StockFlow.slnx --no-restore --configuration Release
      - run: dotnet test StockFlow.slnx --no-build --configuration Release
